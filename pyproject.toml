[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "special-edu-agent"
version = "1.0.0"
description = "特殊教育康复决策智能体 - MCP服务器"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
special-edu-mcp = "app.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]